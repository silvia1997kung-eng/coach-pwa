<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coach Studio">
<meta name="theme-color" content="#534AB7">


<title>Coach Studio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --purple:#534AB7;--purple-l:#EEEDFE;--purple-m:#7F77DD;--purple-d:#3C3489;
  --teal:#0F6E56;--teal-l:#E1F5EE;
  --bg:#F7F7FB;--surface:#FFFFFF;--surface2:#F1F0F8;
  --text:#1A1A2E;--text2:#6B6B8A;--text3:#9999B5;
  --border:#E4E3F0;--border2:#D0CFEA;
  --red:#A32D2D;--red-l:#FCEBEB;
  --green:#0F6E56;--green-l:#E1F5EE;
  --radius:12px;--radius-sm:8px;--radius-xs:6px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;font-size:15px;color:var(--text)}
#app{display:flex;flex-direction:column;height:100%;padding-top:var(--safe-top)}

/* Top header */
.header{background:var(--purple);color:#fff;padding:14px 16px 12px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.header-title{font-size:17px;font-weight:600;letter-spacing:-.3px}
.header-sub{font-size:12px;opacity:.75;margin-top:1px}
.header-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.18);border:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px}

/* Scrollable content area */
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg);padding:14px 14px calc(80px + var(--safe-bottom))}

/* Bottom nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;padding-bottom:var(--safe-bottom);z-index:100}
.nav-tab{flex:1;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--text3);border:none;background:none;font-family:inherit}
.nav-tab.active{color:var(--purple)}
.nav-tab i{font-size:22px}
.nav-tab span{font-size:10px;font-weight:500}

/* Cards */
.card{background:var(--surface);border-radius:var(--radius);padding:14px;margin-bottom:10px;border:1px solid var(--border)}
.card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-title{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;color:var(--text)}
.section-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 8px;display:flex;align-items:center;gap:7px}
.section-label::after{content:'';flex:1;height:1px;background:var(--border)}

/* Buttons */
.btn{padding:9px 16px;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--surface);cursor:pointer;font-size:13px;color:var(--text);display:inline-flex;align-items:center;gap:6px;font-family:inherit;font-weight:500;transition:opacity .1s;-webkit-appearance:none}
.btn:active{opacity:.7}
.btn-primary{background:var(--purple);color:#fff;border-color:var(--purple)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-teal{background:var(--teal-l);color:var(--teal);border-color:var(--teal-l)}
.btn-danger{background:var(--red-l);color:var(--red);border-color:var(--red-l)}
.btn-block{width:100%;justify-content:center}
.btn-ghost{border-color:transparent;background:transparent;padding-left:4px;padding-right:4px}

/* Forms */
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:12px;font-weight:600;color:var(--text2)}
.field input,.field select,.field textarea{border:1px solid var(--border2);border-radius:var(--radius-sm);padding:10px 12px;font-size:15px;background:var(--surface);color:var(--text);width:100%;font-family:inherit;-webkit-appearance:none;appearance:none}
.field textarea{resize:vertical;min-height:80px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 3px var(--purple-l)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* Badges */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.badge-purple{background:var(--purple-l);color:var(--purple)}
.badge-teal{background:var(--teal-l);color:var(--teal)}
.badge-gray{background:var(--surface2);color:var(--text2)}

/* Student list */
.stu-item{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--surface);border-radius:var(--radius);margin-bottom:8px;border:1px solid var(--border);cursor:pointer}
.stu-item:active{opacity:.7}
.stu-avatar{width:42px;height:42px;border-radius:50%;background:var(--purple-l);color:var(--purple);font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stu-info{flex:1;min-width:0}
.stu-name{font-size:15px;font-weight:600}
.stu-sub{font-size:12px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Info rows */
.info-row{display:flex;justify-content:space-between;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border)}
.info-row:last-child{border-bottom:none}
.info-lbl{font-size:12px;color:var(--text2);font-weight:500;min-width:90px}
.info-val{font-size:13px;color:var(--text);font-weight:500;text-align:right;flex:1}

/* Exercise blocks */
.ex-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
.ex-hd{background:var(--surface2);padding:11px 13px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.ex-hd-title{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
.ex-body{padding:13px}

/* Set table */
.set-table{width:100%;border-collapse:collapse;font-size:13px}
.set-table th{padding:7px 6px;background:var(--surface2);color:var(--text2);font-weight:600;font-size:11px;text-align:left;border-bottom:1px solid var(--border)}
.set-table th:first-child{width:30px;text-align:center;border-radius:var(--radius-xs) 0 0 0}
.set-table td{padding:5px 4px;border-bottom:1px solid var(--border);vertical-align:middle}
.set-table td:first-child{text-align:center;font-size:11px;color:var(--text3);font-weight:600}
.set-table tr:last-child td{border-bottom:none}
.set-input{border:1px solid var(--border2);border-radius:var(--radius-xs);padding:6px 7px;font-size:13px;background:var(--surface);color:var(--text);width:100%;font-family:inherit;-webkit-appearance:none}
.set-input:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 2px var(--purple-l)}

/* Add buttons */
.add-row-btn{border:1px dashed var(--border2);border-radius:var(--radius-sm);padding:8px;font-size:12px;color:var(--text3);background:transparent;width:100%;display:flex;align-items:center;justify-content:center;gap:5px;margin-top:8px;cursor:pointer;font-family:inherit}
.add-row-btn:active{background:var(--purple-l);color:var(--purple);border-color:var(--purple)}
.add-ex-btn{border:2px dashed var(--border2);border-radius:var(--radius);padding:16px;font-size:14px;color:var(--text3);background:transparent;width:100%;display:flex;align-items:center;justify-content:center;gap:7px;margin-top:6px;cursor:pointer;font-family:inherit}
.add-ex-btn:active{background:var(--purple-l);color:var(--purple);border-color:var(--purple)}

/* Spring dots */
.spring-row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:6px 0}
.sdot{width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid transparent;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0}
.sdot.sel{border-color:var(--text);transform:scale(1.1)}
.spring-qty-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.spring-qty-chip{display:flex;align-items:center;gap:6px;font-size:12px;background:var(--surface2);padding:5px 10px;border-radius:20px;border:1px solid var(--border)}

/* Photos */
.photo-upload-zone{border:2px dashed var(--border2);border-radius:var(--radius);padding:28px 16px;text-align:center;cursor:pointer;color:var(--text3);margin-bottom:12px}
.photo-upload-zone i{font-size:32px;display:block;margin-bottom:8px}
.photo-upload-zone p{font-size:14px;margin-bottom:4px}
.photo-upload-zone small{font-size:12px}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.photo-thumb{position:relative;border-radius:var(--radius-sm);overflow:hidden;aspect-ratio:1;border:1px solid var(--border)}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.photo-del{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.55);border:none;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.photo-caption{width:100%;margin-top:4px;border:1px solid var(--border2);border-radius:var(--radius-xs);padding:5px 8px;font-size:12px;background:var(--surface);color:var(--text);font-family:inherit}

/* Lightbox */
.lightbox{background:rgba(0,0,0,.88);border-radius:var(--radius);padding:16px;margin-bottom:12px;text-align:center}
.lightbox img{max-width:100%;max-height:55vh;border-radius:var(--radius-sm);object-fit:contain}
.lightbox-caption{color:rgba(255,255,255,.8);font-size:13px;margin-top:8px}
.lightbox-nav{display:flex;justify-content:center;gap:10px;margin-top:12px}

/* Log history card */
.log-card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);margin-bottom:10px;overflow:hidden}
.log-card-hd{background:var(--surface2);padding:11px 13px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px}
.log-card-body{padding:12px 13px}

/* Alert toast */
.toast{position:fixed;top:calc(var(--safe-top) + 60px);left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 18px;border-radius:30px;font-size:13px;font-weight:500;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.toast.success{background:#1D7A5F}
.toast.error{background:#A32D2D}

/* Page transitions */
.page{display:none}
.page.active{display:block}
.hidden{display:none!important}

/* Back nav */
.back-hd{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.back-hd h2{font-size:17px;font-weight:600;flex:1}

/* Tab bar within page */
.seg{display:flex;background:var(--surface2);border-radius:var(--radius-sm);padding:3px;gap:2px;margin-bottom:14px}
.seg-btn{flex:1;padding:8px 6px;border-radius:var(--radius-xs);border:none;background:transparent;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;font-family:inherit;text-align:center}
.seg-btn.active{background:var(--surface);color:var(--purple);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* DB section */
.db-block-label{font-size:11px;font-weight:700;color:var(--purple);text-transform:uppercase;letter-spacing:.06em;padding:6px 0 4px;border-top:1px solid var(--border);margin-top:10px}
.db-block-label:first-child{border-top:none;margin-top:0}
.db-ex-row{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);gap:10px}
.db-ex-row:last-child{border-bottom:none}
</style>

</head>
<body>
<div id="app">
  <div class="header">
    <div>
      <div class="header-title" id="header-title">Coach Studio</div>
      <div class="header-sub" id="header-sub">教練管理系統</div>
    </div>
    <button class="header-btn hidden" id="header-action-btn" onclick="headerAction()">
      <i class="ti ti-plus" id="header-action-icon"></i>
    </button>
  </div>

  <div class="content" id="main-content">

    <!-- STUDENTS PAGE -->
    <div id="page-students" class="page active">
      <div id="stu-list-view">
        <div id="students-list"></div>
      </div>
      <div id="stu-detail-view" class="hidden"></div>
      <div id="stu-form-view" class="hidden"></div>
    </div>

    <!-- LOG PAGE -->
    <div id="page-log" class="page">
      <div class="card">
        <div class="card-title" style="margin-bottom:12px"><i class="ti ti-calendar-event" style="color:var(--purple)"></i> 課程基本資訊</div>
        <div class="f2">
          <div class="field"><label>學員</label><select id="log-student"></select></div>
          <div class="field"><label>日期</label><input id="log-date" type="date"></div>
        </div>
        <div class="f2">
          <div class="field"><label>時間</label><input id="log-time" type="time" value="09:00"></div>
          <div class="field"><label>地點</label><input id="log-location" placeholder="健身房"></div>
        </div>
      </div>

      <div class="seg">
        <button class="seg-btn active" onclick="switchSeg('weight')" id="seg-weight">重訓</button>
        <button class="seg-btn" onclick="switchSeg('pilates')" id="seg-pilates">皮拉提斯</button>
        <button class="seg-btn" onclick="switchSeg('photos')" id="seg-photos">照片</button>
        <button class="seg-btn" onclick="switchSeg('note')" id="seg-note">備註</button>
      </div>

      <div id="seg-content-weight">
        <div id="weight-exercises"></div>
        <button class="add-ex-btn" onclick="addWeightEx()"><i class="ti ti-plus"></i> 新增重訓動作</button>
      </div>
      <div id="seg-content-pilates" class="hidden">
        <div id="pilates-exercises"></div>
        <button class="add-ex-btn" onclick="addPilatesEx()"><i class="ti ti-plus"></i> 新增皮拉提斯動作</button>
      </div>
      <div id="seg-content-photos" class="hidden">
        <div id="log-photo-grid" class="photo-grid"></div>
        <div class="photo-upload-zone" onclick="document.getElementById('log-photo-input').click()">
          <i class="ti ti-camera"></i>
          <p>點擊上傳照片</p>
          <small>可一次選多張 · JPG / PNG / HEIC</small>
        </div>
        <input type="file" id="log-photo-input" accept="image/*" multiple style="display:none" onchange="handlePhotoUpload(event)">
      </div>
      <div id="seg-content-note" class="hidden">
        <div class="field"><label>今日課程備註</label>
          <textarea id="log-note" placeholder="今日學員狀態、需追蹤事項、下次課程方向…"></textarea>
        </div>
      </div>

      <div style="display:flex;gap:8px;margin-top:14px">
        <button class="btn btn-primary btn-block" onclick="saveLog()"><i class="ti ti-device-floppy"></i> 儲存本次課程</button>
        <button class="btn" onclick="clearLog()"><i class="ti ti-refresh"></i></button>
      </div>
    </div>

    <!-- DB PAGE -->
    <div id="page-db" class="page">
      <div class="seg">

function collectStuFields(){
  const flds=['name','gender','dob','height','weight','fat','start','classFreq','selfFreq','bowel','goalS','goalL','sleep','wake','food','pain','history','eating','period','pms','meds'];
  const obj={};flds.forEach(f=>{const el=document.getElementById('es-'+f);obj[f]=el?el.value:''});
  return obj;
}

function saveEditStu(id){
  const data=collectStuFields();
  if(!data.name){toast('請輸入姓名','error');return}
  const s=state.students.find(x=>x.id===id);
  Object.assign(s,data);save();
  toast('學員資料已更新！');
  document.getElementById('edit-stu-form-'+id).classList.add('hidden');
  showStuDetail(id);
}

function showAddStudentForm(){

  const v=document.getElementById('stu-form-view');
  v.classList.remove('hidden');
  v.innerHTML=`<div class="card">${stuFormHTML(null,'addStudent()',null)}</div>`;

function addStudent(){
  const data=collectStuFields();

  data.id=state.nextId++;
  state.students.push(data);save();
  toast('學員已新增！');
  showStuDetail(data.id);

      </div>
      <div class="spring-qty-row" id="${id}-sqty"></div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:8px">
        <span style="font-size:12px;color:var(--text3)">其他：</span>
        <input id="${id}-cspring" value="${pre?.customSpring||''}" placeholder="長彈簧×1" style="flex:1;border:1px solid var(--border2);border-radius:var(--radius-xs);padding:7px 10px;font-size:13px;background:var(--surface);color:var(--text);font-family:inherit">
      </div>
    </div>
    <div class="f2">
      <div class="field"><label>已學習次數</label><input type="number" id="${id}-times" value="${pre?.timesLearned||'1'}" min="0"></div>
      <div class="field"><label>注意情況</label><input id="${id}-note" value="${pre?.note||''}" placeholder="今日觀察…"></div>
    </div>
  </div>`;
  document.getElementById('pilates-exercises').appendChild(div);
  updatePNames(id,pre?.name);
  if(selSprings.length)selSprings.forEach(s=>renderSpringQty(id,s.color,true,s.qty));
}

function updatePNames(id,pre){
  const bl=document.getElementById(id+'-block');const nm=document.getElementById(id+'-name');
  if(!bl||!nm)return;
  const names=getPilatesNames(bl.value);
  nm.innerHTML=names.length?names.map(n=>`<option${pre===n?' selected':''}>${n}</option>`).join(''):`<option value=''>— 此板塊尚無動作 —</option>`;
}

function toggleSpring(id,el,color){
  el.classList.toggle('sel');
  renderSpringQty(id,color,el.classList.contains('sel'),'');
}
function renderSpringQty(id,color,add,def){
  const row=document.getElementById(id+'-sqty');if(!row)return;
  const ex=row.querySelector(`[data-color="${color}"]`);
  const ci=SPRINGS.find(c=>c.key===color);
  if(add&&!ex){
    const w=document.createElement('div');w.className='spring-qty-chip';w.dataset.color=color;
    w.innerHTML=`<span style="width:12px;height:12px;border-radius:50%;background:${ci?.hex||'#888'};display:inline-block"></span>
      <span style="color:var(--text2)">${color}(${ci?.val})</span>
      <input type="number" min="1" max="10" value="${def||1}" data-qty style="width:40px;border:1px solid var(--border2);border-radius:var(--radius-xs);padding:4px 6px;font-size:12px;background:var(--surface);color:var(--text);font-family:inherit"> 條`;
    row.appendChild(w);
  }else if(!add&&ex){row.removeChild(ex)}
}
function collectSprings(id){
  const row=document.getElementById(id+'-sqty');if(!row)return[];
  return Array.from(row.querySelectorAll('[data-color]')).map(w=>({color:w.dataset.color,qty:w.querySelector('[data-qty]')?.value||'1'}));
}

function handlePhotoUpload(e){
  Array.from(e.target.files).forEach(f=>{
    const r=new FileReader();
    r.onload=ev=>{logPhotos.push({dataUrl:ev.target.result,caption:''});renderLogPhotos()};
    r.readAsDataURL(f);
  });
  e.target.value='';
}
function renderLogPhotos(){
  const grid=document.getElementById('log-photo-grid');
  grid.innerHTML=logPhotos.map((p,i)=>`
    <div>
      <div class="photo-thumb" onclick="previewPhoto(${i},'log')">
        <img src="${p.dataUrl}" alt="">
        <button class="photo-del" onclick="event.stopPropagation();logPhotos.splice(${i},1);renderLogPhotos()"><i class="ti ti-x" style="font-size:11px"></i></button>
      </div>
      <input class="photo-caption" placeholder="說明" value="${p.caption||''}" oninput="logPhotos[${i}].caption=this.value">
    </div>`).join('');
}

let previewCtx={photos:[],idx:0,logId:null};
function previewPhoto(idx,src,logId){
  const photos=src==='log'?logPhotos:(state.logs.find(l=>l.id===logId)?.photos||[]);
  previewCtx={photos,idx,logId};
  showPreview();
}
function showPreview(){
  const {photos,idx}=previewCtx;
  const p=photos[idx];if(!p)return;
  const el=document.getElementById('photo-preview-overlay');
  if(el)el.remove();
  const ov=document.createElement('div');
  ov.id='photo-preview-overlay';
  ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;';
  ov.innerHTML=`<img src="${p.dataUrl}" style="max-width:100%;max-height:70vh;border-radius:12px;object-fit:contain">
    ${p.caption?`<div style="color:rgba(255,255,255,.8);font-size:13px;margin-top:10px">${p.caption}</div>`:''}
    <div style="display:flex;gap:12px;margin-top:16px">
      ${idx>0?`<button class="btn" style="background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.3)" onclick="previewCtx.idx--;showPreview()"><i class="ti ti-chevron-left"></i></button>`:''}
      <button class="btn" style="background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.3)" onclick="document.getElementById('photo-preview-overlay').remove()"><i class="ti ti-x"></i> 關閉</button>
      ${idx<photos.length-1?`<button class="btn" style="background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.3)" onclick="previewCtx.idx++;showPreview()"><i class="ti ti-chevron-right"></i></button>`:''}
    </div>`;
  document.body.appendChild(ov);
}

function saveLog(){
  const date=document.getElementById('log-date').value;
  const studentId=parseInt(document.getElementById('log-student').value);
  if(!date||!studentId){toast('請填寫日期和學員','error');return}
  const wBlocks=document.querySelectorAll('[id^="wex-"]');
  const pBlocks=document.querySelectorAll('[id^="pex-"]');
  const weightEx=Array.from(wBlocks).map(b=>{
    const rows=b.querySelectorAll('tbody tr');
    return{name:document.getElementById(b.id+'-name')?.value||'',
      sets:Array.from(rows).map(r=>{const ins=r.querySelectorAll('input');return{weight:ins[0]?.value||'',reps:ins[1]?.value||'',rest:ins[2]?.value||'',note:ins[3]?.value||''}})};
  });
  const pilatesEx=Array.from(pBlocks).map(b=>({
    name:document.getElementById(b.id+'-name')?.value||'',
    block:document.getElementById(b.id+'-block')?.value||'',
    level:document.getElementById(b.id+'-level')?.value||'',
    muscle:document.getElementById(b.id+'-muscle')?.value||'',
    springs:collectSprings(b.id),
    customSpring:document.getElementById(b.id+'-cspring')?.value||'',
    timesLearned:document.getElementById(b.id+'-times')?.value||'',
    note:document.getElementById(b.id+'-note')?.value||''
  }));
  state.logs.unshift({
    id:state.nextId++,studentId,
    date:date.replace(/-/g,'/'),
    time:document.getElementById('log-time').value,
    location:document.getElementById('log-location').value,
    weightEx,pilatesEx,
    photos:logPhotos.map(p=>({dataUrl:p.dataUrl,caption:p.caption||''})),
    note:document.getElementById('log-note').value
  });
  save();toast('課程紀錄已儲存！');clearLog();
}

function clearLog(){
  document.getElementById('weight-exercises').innerHTML='';
  document.getElementById('pilates-exercises').innerHTML='';
  document.getElementById('log-note').value='';
  document.getElementById('log-location').value='';
  document.getElementById('log-photo-grid').innerHTML='';
  logPhotos=[];wCount=0;pCount=0;
  switchSeg('weight');
}

/* ===== DB ===== */
function renderDb(){renderDbW();renderDbP()}
function renderDbW(){
  document.getElementById('db-weight-list').innerHTML=state.exercises.weight.map((e,i)=>`
    <div class="db-ex-row">
      <i class="ti ti-barbell" style="color:var(--purple);font-size:18px;flex-shrink:0"></i>
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;font-size:14px">${e.name}</div>
        <div style="font-size:12px;color:var(--text2)">${e.muscle}${e.note?' · '+e.note:''}</div>
      </div>
      <button class="btn btn-danger btn-sm" onclick="rmDb('weight',${i})"><i class="ti ti-trash"></i></button>
    </div>`).join('');
}
function renderDbP(){
  const byBlock={};BASI.forEach(b=>byBlock[b]=[]);
  state.exercises.pilates.forEach(e=>{if(byBlock[e.block])byBlock[e.block].push(e)});
  document.getElementById('db-pilates-list').innerHTML=BASI.map(b=>{
    const exs=byBlock[b];if(!exs.length)return'';
    return`<div class="db-block-label">${b}</div>
    ${exs.map(e=>{const i=state.exercises.pilates.indexOf(e);return`
      <div class="db-ex-row">
        <i class="ti ti-stretching" style="color:var(--teal);font-size:18px;flex-shrink:0"></i>
        <div style="flex:1;min-width:0">
          <div style="font-weight:600;font-size:14px">${e.name} <span class="badge badge-teal" style="font-size:10px">${e.level}</span></div>
          <div style="font-size:12px;color:var(--text2)">${e.muscle}${e.note?' · '+e.note:''}</div>
        </div>
        <button class="btn btn-danger btn-sm" onclick="rmDb('pilates',${i})"><i class="ti ti-trash"></i></button>
      </div>`}).join('')}`;
  }).join('');
}
function addDbEx(type){
  if(type==='weight'){
    const name=document.getElementById('db-w-name').value;if(!name){toast('請輸入動作名稱','error');return}
    state.exercises.weight.push({name,muscle:document.getElementById('db-w-muscle').value,note:document.getElementById('db-w-note').value});
    ['db-w-name','db-w-muscle','db-w-note'].forEach(id=>document.getElementById(id).value='');
    renderDbW();
  }else{
    const name=document.getElementById('db-p-name').value;if(!name){toast('請輸入動作名稱','error');return}
    state.exercises.pilates.push({name,block:document.getElementById('db-p-block').value,level:document.getElementById('db-p-level').value,muscle:document.getElementById('db-p-muscle').value,note:document.getElementById('db-p-note').value});
    ['db-p-name','db-p-muscle','db-p-note'].forEach(id=>document.getElementById(id).value='');
    renderDbP();
  }
  save();toast('動作已加入資料庫！');
}
function rmDb(type,idx){state.exercises[type].splice(idx,1);save();type==='weight'?renderDbW():renderDbP()}

/* ===== HISTORY ===== */
function renderHistFilter(){
  const sel=document.getElementById('hist-filter');const cur=sel.value;
  sel.innerHTML='<option value="">全部學員</option>'+state.students.map(s=>`<option value="${s.id}">${s.name}</option>`).join('');
  if(cur)sel.value=cur;
}
function renderHistory(){
  const fv=document.getElementById('hist-filter').value;
  const logs=fv?state.logs.filter(l=>l.studentId==fv):state.logs;
  const el=document.getElementById('history-list');
  if(!logs.length){el.innerHTML='<div style="text-align:center;padding:50px;color:var(--text3)"><i class="ti ti-calendar-off" style="font-size:48px;display:block;margin-bottom:10px"></i>尚無訓練紀錄</div>';return}
  const wd=['日','一','二','三','四','五','六'];
  const springStr=spr=>spr.map(s=>`${s.color}×${s.qty}`).join('+');
  el.innerHTML=logs.map(l=>{
    const s=state.students.find(x=>x.id===l.studentId);
    const d=new Date(l.date.replace(/\//g,'-'));
    const wdStr=isNaN(d)?'':` 週${wd[d.getDay()]}`;
    const photoCount=l.photos?.length||0;
    return`<div class="log-card" id="hlog-${l.id}">
      <div class="log-card-hd">
        <div style="flex:1;min-width:0">
          <div style="font-weight:600;font-size:14px">${l.date}${wdStr} ${l.time}</div>
          <div style="display:flex;gap:5px;margin-top:4px;flex-wrap:wrap">
            <span class="badge badge-purple">${s?.name||'未知'}</span>
            ${l.location?`<span class="badge badge-gray">${l.location}</span>`:''}
            ${photoCount?`<span class="badge badge-teal"><i class="ti ti-camera" style="font-size:11px"></i> ${photoCount}</span>`:''}
          </div>
        </div>
        <button class="btn btn-teal btn-sm" onclick="editHistLog(${l.id})"><i class="ti ti-edit"></i></button>
      </div>
      <div class="log-card-body">
        ${l.weightEx?.length?`<div class="section-label">重訓</div>
          ${l.weightEx.map(e=>`<div style="margin-bottom:10px">
            <div style="font-weight:600;font-size:13px;margin-bottom:6px;display:flex;align-items:center;gap:6px"><i class="ti ti-barbell" style="color:var(--purple)"></i>${e.name}</div>
            <div style="overflow-x:auto"><table class="set-table" style="min-width:280px">
              <thead><tr><th>組</th><th>重量</th><th>次數</th><th>休息</th><th>備註</th></tr></thead>
              <tbody>${(e.sets||[]).map((s,i)=>`<tr><td>${i+1}</td><td>${s.weight||'—'}</td><td>${s.reps||'—'}</td><td>${s.rest||'—'}</td><td style="color:var(--text2)">${s.note||''}</td></tr>`).join('')}</tbody>
            </table></div>
          </div>`).join('')}`:''}
        ${l.pilatesEx?.length?`<div class="section-label">皮拉提斯</div>
          ${l.pilatesEx.map(e=>`<div style="padding:8px 0;border-bottom:1px solid var(--border)">
            <div style="font-weight:600;font-size:13px;margin-bottom:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap">
              <i class="ti ti-stretching" style="color:var(--teal)"></i>${e.name}
              <span class="badge badge-teal" style="font-size:10px">${e.block||''}</span>
              <span class="badge badge-gray" style="font-size:10px">${e.level||''}</span>
            </div>
            <div style="font-size:12px;color:var(--text2)">
              ${e.springs?.length?`彈簧：${springStr(e.springs)}${e.customSpring?' + '+e.customSpring:''}　`:''}已學 ${e.timesLearned||0} 次
              ${e.note?`<div style="margin-top:2px">${e.note}</div>`:''}
            </div>
          </div>`).join('')}`:''}
        ${l.photos?.length?`<div class="section-label">照片</div>
          <div class="photo-grid" style="margin-bottom:8px">
            ${l.photos.map((p,pi)=>`<div>
              <div class="photo-thumb" onclick="previewPhoto(${pi},'hist',${l.id})"><img src="${p.dataUrl}" alt=""></div>
              ${p.caption?`<div style="font-size:11px;color:var(--text2);margin-top:3px;text-align:center">${p.caption}</div>`:''}
            </div>`).join('')}
          </div>`:''}
        ${l.note?`<div style="margin-top:8px;padding:10px 12px;background:var(--surface2);border-radius:var(--radius-sm);font-size:13px;color:var(--text2);border-left:3px solid var(--purple)">${l.note}</div>`:''}
      </div>
      <div id="hlog-edit-${l.id}" class="hidden" style="padding:13px;border-top:1px solid var(--border)"></div>
    </div>`;
  }).join('');
}

function editHistLog(logId){
  const l=state.logs.find(x=>x.id===logId);
  const el=document.getElementById('hlog-edit-'+logId);
  if(!el.classList.contains('hidden')){el.classList.add('hidden');return}
  el.classList.remove('hidden');
  el.innerHTML=`<div style="font-size:13px;font-weight:600;margin-bottom:12px">編輯課程資訊</div>
    <div class="f2">
      <div class="field"><label>日期</label><input id="el-date-${logId}" value="${l.date}"></div>
      <div class="field"><label>時間</label><input id="el-time-${logId}" value="${l.time}"></div>
    </div>
    <div class="field"><label>地點</label><input id="el-loc-${logId}" value="${l.location||''}"></div>
    <div class="field"><label>今日備註</label><textarea id="el-note-${logId}">${l.note||''}</textarea></div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="btn btn-primary btn-block" onclick="saveHistLogEdit(${logId})"><i class="ti ti-check"></i> 儲存修改</button>
      <button class="btn" onclick="document.getElementById('hlog-edit-${logId}').classList.add('hidden')"><i class="ti ti-x"></i></button>
    </div>`;
}
function saveHistLogEdit(logId){
  const l=state.logs.find(x=>x.id===logId);
  l.date=document.getElementById('el-date-'+logId).value;
  l.time=document.getElementById('el-time-'+logId).value;
  l.location=document.getElementById('el-loc-'+logId).value;
  l.note=document.getElementById('el-note-'+logId).value;
  save();toast('紀錄已更新！');
  document.getElementById('hlog-edit-'+logId).classList.add('hidden');
  renderHistory();
}

/* ===== TOAST ===== */
function toast(msg,type='success'){
  const el=document.getElementById('toast');
  el.textContent=msg;el.className='toast '+type+' show';
  clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2400);
}

/* ===== SERVICE WORKER ===== */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})});
}

renderStudents();
</script>
