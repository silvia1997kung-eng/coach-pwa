<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coach Studio">
<meta name="theme-color" content="#6F8D6B">
<title>Coach Studio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --g1:#6F8D6B;--g2:#A8C6A1;--g3:#E8F2E7;--g4:#4A6347;
  --b1:#A4BCC2;--b2:#E4EEF0;
  --cream:#F5EAC2;--bg:#FAF8F2;--sf:#fff;--sf2:#F0EDE3;
  --tx:#2C3A2A;--tx2:#5A6B57;--tx3:#8FA68C;
  --bd:#D8E4D6;--bd2:#C5D8C2;
  --red:#8B3A2A;--redl:#F5E8E5;
  --r:12px;--r2:8px;--r3:6px;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)
}
@keyframes spin{to{transform:rotate(360deg)}}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:15px;color:var(--tx)}
#app{display:flex;flex-direction:column;height:100%;padding-top:var(--st)}
.hdr{background:var(--g1);color:#fff;padding:14px 16px 12px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.hdr-title{font-size:17px;font-weight:600}.hdr-sub{font-size:12px;opacity:.75;margin-top:1px}
.hdr-btns{display:flex;gap:8px}
.hdr-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.2);border:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px;position:relative;font-family:inherit}
.hdr-btn.hidden{display:none}
.upd-dot{width:8px;height:8px;background:var(--cream);border-radius:50%;position:absolute;top:4px;right:4px;display:none;border:1.5px solid var(--g4)}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg);padding:14px 14px calc(80px + var(--sb))}
.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--bd);display:flex;padding-bottom:var(--sb);z-index:100}
.ntab{flex:1;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--tx3);border:none;background:none;font-family:inherit;font-size:10px;font-weight:500}
.ntab.active{color:var(--g4)}.ntab svg{width:22px;height:22px}
.card{background:var(--sf);border-radius:var(--r);padding:14px;margin-bottom:10px;border:1px solid var(--bd)}
.card-title{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;margin-bottom:14px}
.slbl{font-size:11px;font-weight:600;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 8px;display:flex;align-items:center;gap:8px}
.slbl::after{content:'';flex:1;height:1px;background:var(--g2)}
.btn{padding:9px 16px;border-radius:var(--r2);border:1px solid var(--bd2);background:var(--sf);cursor:pointer;font-size:13px;color:var(--tx);display:inline-flex;align-items:center;gap:6px;font-family:inherit;font-weight:500;-webkit-appearance:none}
.btn:active{opacity:.7}
.btn-p{background:var(--g1);color:#fff;border-color:var(--g1)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-t{background:var(--b2);color:#2C5A62;border-color:var(--b2)}
.btn-d{background:var(--redl);color:var(--red);border-color:var(--redl)}
.btn-blk{width:100%;justify-content:center}
.btn-gh{border-color:transparent;background:transparent;padding-left:4px;padding-right:4px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:12px;font-weight:600;color:var(--tx2)}
.field input,.field select,.field textarea{border:1px solid var(--bd2);border-radius:var(--r2);padding:10px 12px;font-size:15px;background:var(--sf);color:var(--tx);width:100%;font-family:inherit;-webkit-appearance:none;appearance:none}
.field textarea{resize:vertical;min-height:80px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--g1);box-shadow:0 0 0 3px var(--g3)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bdg{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.bdg-g{background:var(--g3);color:var(--g4)}.bdg-b{background:var(--b2);color:#2C5A62}.bdg-gr{background:var(--sf2);color:var(--tx2)}
.stu-item{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--sf);border-radius:var(--r);margin-bottom:8px;border:1px solid var(--bd);cursor:pointer}
.stu-av{width:42px;height:42px;border-radius:50%;background:var(--g2);color:var(--g4);font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.irow{display:flex;justify-content:space-between;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--bd)}
.irow:last-child{border-bottom:none}
.ilbl{font-size:12px;color:var(--tx2);font-weight:500;min-width:90px}
.ival{font-size:13px;color:var(--tx);font-weight:500;text-align:right;flex:1}
.ex-block{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.ex-hd{background:var(--cream);padding:11px 13px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bd)}
.ex-hd-title{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
.ex-body{padding:13px}
.stbl{width:100%;border-collapse:collapse;font-size:13px}
.stbl th{padding:7px 6px;background:var(--cream);color:var(--tx2);font-weight:600;font-size:11px;text-align:left;border-bottom:1px solid var(--bd)}
.stbl th:first-child{width:30px;text-align:center}
.stbl td{padding:5px 4px;border-bottom:1px solid var(--bd);vertical-align:middle}
.stbl td:first-child{text-align:center;font-size:11px;color:var(--tx3);font-weight:600}
.stbl tr:last-child td{border-bottom:none}
.si{border:1px solid var(--bd2);border-radius:var(--r3);padding:6px 7px;font-size:13px;background:var(--sf);color:var(--tx);width:100%;font-family:inherit;-webkit-appearance:none}
.si:focus{outline:none;border-color:var(--g1);box-shadow:0 0 0 2px var(--g3)}
.add-r-btn{border:1px dashed var(--bd2);border-radius:var(--r2);padding:8px;font-size:12px;color:var(--tx3);background:transparent;width:100%;display:flex;align-items:center;justify-content:center;gap:5px;margin-top:8px;cursor:pointer;font-family:inherit}
.add-ex-btn{border:2px dashed var(--bd2);border-radius:var(--r);padding:16px;font-size:14px;color:var(--tx3);background:transparent;width:100%;display:flex;align-items:center;justify-content:center;gap:7px;margin-top:6px;cursor:pointer;font-family:inherit}
.seg{display:flex;background:var(--g3);border-radius:var(--r2);padding:3px;gap:2px;margin-bottom:14px}
.seg-btn{flex:1;padding:8px 4px;border-radius:var(--r3);border:none;background:transparent;font-size:12px;font-weight:500;color:var(--tx2);cursor:pointer;font-family:inherit;text-align:center}
.seg-btn.active{background:var(--cream);color:var(--g4);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.spr-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.sdot{width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid transparent;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff}
.sdot.sel{border-color:var(--tx)}
.spr-qty-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.spr-chip{display:flex;align-items:center;gap:6px;font-size:12px;background:var(--sf2);padding:5px 10px;border-radius:20px;border:1px solid var(--bd)}
.photo-zone{border:2px dashed var(--bd2);border-radius:var(--r);padding:28px 16px;text-align:center;cursor:pointer;color:var(--tx3);margin-bottom:12px}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.photo-thumb{position:relative;border-radius:var(--r2);overflow:hidden;aspect-ratio:1;border:1px solid var(--bd)}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.photo-del{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.55);border:none;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.photo-cap{width:100%;margin-top:4px;border:1px solid var(--bd2);border-radius:var(--r3);padding:5px 8px;font-size:12px;background:var(--sf);color:var(--tx);font-family:inherit}
.log-card{background:var(--sf);border-radius:var(--r);border:1px solid var(--bd);margin-bottom:10px;overflow:hidden}
.log-hd{background:var(--cream);padding:11px 13px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;gap:8px}
.log-body{padding:12px 13px}
.toast{position:fixed;top:calc(var(--st) + 60px);left:50%;transform:translateX(-50%);background:var(--tx);color:#fff;padding:10px 18px;border-radius:30px;font-size:13px;font-weight:500;z-index:9999;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}.toast.ok{background:var(--g4)}.toast.err{background:var(--red)}
.page{display:none}.page.active{display:block}.hidden{display:none!important}
.back-hd{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.back-hd h2{font-size:17px;font-weight:600;flex:1}
.db-blbl{font-size:11px;font-weight:700;color:var(--g1);text-transform:uppercase;letter-spacing:.06em;padding:8px 0 4px;border-top:1px solid var(--bd);margin-top:8px}
.db-blbl:first-child{border-top:none;margin-top:0}
.db-row{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd);gap:10px}
.db-row:last-child{border-bottom:none}
.upd-banner{position:fixed;top:0;left:0;right:0;z-index:9998;background:var(--g4);color:#fff;padding:12px 16px;padding-top:calc(12px + var(--st));display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;box-shadow:0 2px 12px rgba(0,0,0,.3)}
.upd-banner-btn{background:var(--cream);color:var(--tx);border:none;border-radius:var(--r2);padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.ex-edit-box{margin-bottom:12px;background:var(--sf2);border-radius:var(--r2);padding:10px}
</style>
</head>
<body>
<div id="app">
  <div class="hdr">
    <div>
      <div class="hdr-title" id="hdr-title">Coach Studio</div>
      <div class="hdr-sub" id="hdr-sub">教練管理系統</div>
    </div>
    <div class="hdr-btns">
      <button class="hdr-btn hidden" id="hdr-add" onclick="hdrAdd()">＋</button>
      <button class="hdr-btn" onclick="manualUpdate()" title="檢查更新">
        <span id="upd-dot" class="upd-dot"></span>
        <svg id="upd-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M20 11A8.1 8.1 0 0 0 4.5 9M4 5v4h4"/><path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4"/></svg>
      </button>
    </div>
  </div>
  <div class="content" id="main-content">
    <div id="page-students" class="page active">
      <div id="vlist">
        <div style="display:flex;gap:8px;margin-bottom:12px">
          <button class="btn btn-sm" style="flex:1;justify-content:center" onclick="exportData()">📤 匯出備份</button>
          <button class="btn btn-sm" style="flex:1;justify-content:center" onclick="document.getElementById('import-input').click()">📥 匯入還原</button>
          <input type="file" id="import-input" accept=".json" style="display:none" onchange="importData(event)">
        </div>
        <div id="slist"></div>
      </div>
      <div id="vdetail" class="hidden"></div>
      <div id="vform" class="hidden"></div>
    </div>
    <div id="page-log" class="page">
      <div class="card">
        <div class="card-title">📅 課程基本資訊</div>
        <div class="f2">
          <div class="field"><label>學員</label><select id="log-stu"></select></div>
          <div class="field"><label>日期</label><input id="log-date" type="date"></div>
        </div>
        <div class="f2">
          <div class="field"><label>時間</label><input id="log-time" type="time" value="09:00"></div>
          <div class="field"><label>地點</label><input id="log-loc" placeholder="健身房"></div>
        </div>
      </div>
      <div class="seg">
        <button class="seg-btn active" onclick="switchSeg('w')" id="sb-w">重訓</button>
        <button class="seg-btn" onclick="switchSeg('p')" id="sb-p">皮拉提斯</button>
        <button class="seg-btn" onclick="switchSeg('ph')" id="sb-ph">照片</button>
        <button class="seg-btn" onclick="switchSeg('n')" id="sb-n">備註</button>
      </div>
      <div id="sc-w"><div id="wexs"></div><button class="add-ex-btn" onclick="addWEx()">＋ 新增重訓動作</button></div>
      <div id="sc-p" class="hidden"><div id="pexs"></div><button class="add-ex-btn" onclick="addPEx()">＋ 新增皮拉提斯動作</button></div>
      <div id="sc-ph" class="hidden">
        <div id="ph-grid" class="photo-grid"></div>
        <div class="photo-zone" onclick="document.getElementById('ph-input').click()">
          <div style="font-size:32px;margin-bottom:8px">📷</div>
          <p style="font-size:14px;margin-bottom:4px">點擊上傳照片</p>
          <small style="font-size:12px">可一次選多張</small>
        </div>
        <input type="file" id="ph-input" accept="image/*" multiple style="display:none" onchange="handlePhoto(event)">
      </div>
      <div id="sc-n" class="hidden">
        <div class="field"><label>今日備註</label><textarea id="log-note" placeholder="今日學員狀態、追蹤事項…"></textarea></div>
      </div>
      <div style="display:flex;gap:8px;margin-top:14px">
        <button class="btn btn-p btn-blk" onclick="saveLog()">💾 儲存本次課程</button>
        <button class="btn" onclick="clearLog()">↺</button>
      </div>
    </div>
    <div id="page-db" class="page">
      <div class="seg">
        <button class="seg-btn active" onclick="switchDbSeg('w')" id="dbs-w">重訓動作庫</button>
        <button class="seg-btn" onclick="switchDbSeg('p')" id="dbs-p">皮拉提斯動作庫</button>
      </div>
      <div id="dbc-w">
        <div id="dbwl"></div>
        <div class="card" style="border-style:dashed">
          <div class="card-title">＋ 新增重訓動作</div>
          <div class="f2">
            <div class="field"><label>動作名稱</label><input id="dbwn" placeholder="槓鈴深蹲"></div>
            <div class="field"><label>目標肌群</label><input id="dbwm" placeholder="股四頭肌"></div>
          </div>
          <div class="field"><label>備注</label><input id="dbwnote" placeholder="注意事項"></div>
          <button class="btn btn-p btn-blk" onclick="addDbEx('w')">＋ 新增</button>
        </div>
      </div>
      <div id="dbc-p" class="hidden">
        <div id="dbpl"></div>
        <div id="db-block-existing" style="margin-bottom:10px;padding:10px;background:var(--g3);border-radius:var(--r2);font-size:12px;display:none">
          <div style="font-weight:600;color:var(--g4);margin-bottom:6px">此板塊現有動作：</div>
          <div id="db-block-existing-list" style="color:var(--tx2);line-height:1.8"></div>
        </div>
        <div class="card" style="border-style:dashed">
          <div class="card-title">＋ 新增皮拉提斯動作</div>
          <div class="field"><label>BASI 板塊</label><select id="dbpb" onchange="onDbBlockChange()">
            <option>Warm Up</option><option>Footwork</option><option>Abdominal</option><option>Hip Work</option>
            <option>Spinal Articulation</option><option>Stretches</option>
            <option>Full Body Integration 1</option><option>Full Body Integration 2</option>
            <option>Arm Work</option><option>Leg Work</option>
            <option>Lateral Flexion &amp; Rotation</option><option>Back Extension</option>
          </select></div>
          <div class="field"><label>動作名稱（輸入新動作）</label><input id="dbpn" placeholder="輸入新動作名稱"></div>
          <div class="f2">
            <div class="field"><label>難易程度</label><select id="dbpl2"><option>基礎</option><option>中級</option><option>進階</option></select></div>
            <div class="field"><label>目標肌群</label><input id="dbpm" placeholder="腹部核心"></div>
          </div>
          <div class="field"><label>備注</label><input id="dbpnote" placeholder="注意事項"></div>
          <button class="btn btn-t btn-blk" onclick="addDbEx('p')">＋ 新增</button>
        </div>
      </div>
    </div>
    <div id="page-history" class="page">
      <div class="field" style="margin-bottom:12px">
        <select id="hf" onchange="renderHistory()"><option value="">全部學員</option></select>
      </div>
      <div id="hlist"></div>
    </div>
  </div>
  <div class="bnav">
    <button class="ntab active" onclick="showPage('students')" id="nav-students">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7m-4 0a4 4 0 1 0 8 0 4 4 0 1 0-8 0"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><path d="M21 21v-2a4 4 0 0 0-3-3.85"/></svg>學員
    </button>
    <button class="ntab" onclick="showPage('log')" id="nav-log">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v6"/><line x1="16" y1="3" x2="16" y2="7"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="4" y1="11" x2="20" y2="11"/><line x1="16" y1="19" x2="22" y2="19"/><line x1="19" y1="16" x2="19" y2="22"/></svg>上課
    </button>
    <button class="ntab" onclick="showPage('db')" id="nav-db">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6a8 3 0 0 0 16 0V6"/><path d="M4 12v6a8 3 0 0 0 16 0v-6"/></svg>動作庫
    </button>
    <button class="ntab" onclick="showPage('history')" id="nav-history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="12 8 12 12 14 14"/><path d="M3.05 11a9 9 0 1 1 .5 4m-.5 5v-5h5"/></svg>紀錄
    </button>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const APP_VERSION = '2.0.0';
const BASI = ['Warm Up','Footwork','Abdominal','Hip Work','Spinal Articulation','Stretches',
  'Full Body Integration 1','Full Body Integration 2','Arm Work','Leg Work',
  'Lateral Flexion & Rotation','Back Extension'];
const SPRDEF = [
  {key:'紅',hex:'#C62828',val:'1'},{key:'藍',hex:'#1565C0',val:'0.5'},
  {key:'黃',hex:'#F9A825',val:'0.25'},{key:'綠',hex:'#2E7D32',val:'1.25'}
];

function lsLoad(){try{var s=localStorage.getItem('cs_v2');if(s)return JSON.parse(s);}catch(e){}return null;}
function lsSave(){try{localStorage.setItem('cs_v2',JSON.stringify(ST));}catch(e){showToast('儲存失敗','err');}}

var ST = lsLoad() || {
  students:[
    {id:1,name:'王小美',gender:'女',dob:'1995/03/22',height:'162',weight:'56',fat:'26',start:'2025/06/01',goalS:'2個月減3kg',goalL:'體脂降至20%',classFreq:'每週2次',selfFreq:'每週1次',food:'無',bowel:'正常',sleep:'22:30',wake:'06:30',pain:'左肩偶爾緊繃',history:'無',eating:'無',period:'28天',pms:'輕微頭痛',meds:'無'},
    {id:2,name:'李雅婷',gender:'女',dob:'1988/11/08',height:'168',weight:'62',fat:'28',start:'2025/07/15',goalS:'改善肩頸不適',goalL:'增肌維持健康',classFreq:'每週1次',selfFreq:'每週2次',food:'素食',bowel:'偶爾便秘',sleep:'23:30',wake:'07:00',pain:'頸部僵硬',history:'2020腰椎輕微突出',eating:'無',period:'30天',pms:'無',meds:'無'}
  ],
  exercises:{

// ── 版本更新 ──────────────────────────────────────────────
function manualUpdate(){
  showToast('正在檢查更新…');
  var icon=document.getElementById('upd-icon');
  if(icon) icon.style.animation='spin 1s linear infinite';
  fetch(location.href+'?bust='+Date.now(),{cache:'no-store',headers:{'Cache-Control':'no-cache, no-store, must-revalidate','Pragma':'no-cache'}})
  .then(function(r){return r.text();})
  .then(function(html){
    if(icon) icon.style.animation='';
    var m=html.match(/APP_VERSION = '([^']+)'/);
    if(m&&m[1]&&m[1]!==APP_VERSION){showUpdBanner(m[1]);}
    else{showToast('已是最新版本 v'+APP_VERSION+' ✓','ok');}
  }).catch(function(){if(icon)icon.style.animation='';showToast('無法連線，請確認網路','err');});
}
function showUpdBanner(v){
  if(document.getElementById('upd-banner'))return;
  var el=document.createElement('div');el.id='upd-banner';el.className='upd-banner';
  el.innerHTML='<div style="display:flex;align-items:center;gap:9px"><span style="font-size:20px">🔄</span><div><div style="font-weight:600">新版本 v'+v+' 可用</div><div style="opacity:.75;font-size:11px;margin-top:2px">點更新使用最新功能</div></div></div>'
    +'<button class="upd-banner-btn" onclick="doUpdate()">立即更新</button>';
  document.body.insertBefore(el,document.body.firstChild);
  var dot=document.getElementById('upd-dot');if(dot)dot.style.display='block';
}
function doUpdate(){
  if('caches' in window){caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k);}));}).then(function(){location.reload(true);});}
  else{location.reload(true);}
}
window.addEventListener('load',function(){
  setTimeout(function(){
    fetch(location.href+'?bust='+Date.now(),{cache:'no-store',headers:{'Cache-Control':'no-cache, no-store, must-revalidate','Pragma':'no-cache'}})
    .then(function(r){return r.text();})
    .then(function(html){var m=html.match(/APP_VERSION = '([^']+)'/);if(m&&m[1]&&m[1]!==APP_VERSION)showUpdBanner(m[1]);})
    .catch(function(){});
  },2000);
});

function exportData(){
  var blob=new Blob([JSON.stringify(ST,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;
  var d=new Date();a.download='coachstudio-'+d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()+'.json';
  a.click();URL.revokeObjectURL(url);showToast('備份已下載！','ok');
}
function importData(e){
  var file=e.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      var data=JSON.parse(ev.target.result);
      if(!data.students||!data.logs){showToast('檔案格式錯誤','err');return;}
      if(!confirm('確定要還原備份嗎？\n現有資料將被覆蓋。'))return;
      ST=data;lsSave();
      showToast('資料已還原！共'+ST.students.length+'位學員','ok');
      renderStudents();
    }catch(err){showToast('讀取失敗，請確認檔案','err');}
  };
  reader.readAsText(file);e.target.value='';
}

function renderSprQty(id,color,add,def){
  var row=document.getElementById(id+'-sqty');if(!row)return;
  var ex=row.querySelector('[data-color="'+color+'"]');
  var ci=SPRDEF.find(function(c){return c.key===color;});

    var w=document.createElement('div');w.className='spr-chip';w.dataset.color=color;
    w.innerHTML='<span style="width:12px;height:12px;border-radius:50%;background:'+ci.hex+';display:inline-block"></span>'
      +'<span style="color:var(--tx2)">'+color+'('+ci.val+')</span>'
      +'<input type="number" min="1" max="10" value="'+(def||1)+'" data-qty style="width:44px;border:1px solid var(--bd2);border-radius:var(--r3);padding:3px 6px;font-size:12px;background:var(--sf);color:var(--tx);font-family:inherit"> 條';

function collectSpr(id){

function handlePhoto(e){

function saveLog(){
  var date=document.getElementById('log-date').value;

  if(!date||!sid){showToast('請填寫日期和學員','err');return;}

    return{name:(document.getElementById(b.id+'-name')||{}).value||'',
      sets:Array.from(b.querySelectorAll('tbody tr')).map(function(r){

      })};

      times:(document.getElementById(b.id+'-ti')||{}).value||'',
      note:(document.getElementById(b.id+'-no')||{}).value||''};

  var dateEl=document.getElementById('ed-date-'+id);

  var locEl=document.getElementById('ed-loc-'+id);
  var noteEl=document.getElementById('ed-note-'+id);

  if(timeEl)l.time=timeEl.value;
  if(locEl)l.loc=locEl.value;
  if(noteEl)l.note=noteEl.value;

  var wCon=document.getElementById('ed-wcon-'+id);
  if(wCon){
    l.wex=Array.from(wCon.querySelectorAll('.ex-edit-box')).map(function(box){
      var nameEl=box.querySelector('.ed-wname');

        var ins=tr.querySelectorAll('input');
        return{w:ins[0]?ins[0].value:'',r:ins[1]?ins[1].value:'',rest:ins[2]?ins[2].value:'',note:ins[3]?ins[3].value:''};
      });
      return{name:nameEl?nameEl.value:'',sets:sets};

  var pCon=document.getElementById('ed-pcon-'+id);
  if(pCon){
    l.pex=Array.from(pCon.querySelectorAll('.ex-edit-box')).map(function(box){
      return{
        block:(box.querySelector('.ed-pblk')||{}).value||'',
        name:(box.querySelector('.ed-pname')||{}).value||'',
        level:(box.querySelector('.ed-plv')||{}).value||'',
        muscle:(box.querySelector('.ed-pmu')||{}).value||'',
        cspring:(box.querySelector('.ed-pspr')||{}).value||'',
        times:(box.querySelector('.ed-pti')||{}).value||'0',
        note:(box.querySelector('.ed-pno')||{}).value||'',
        springs:[]
      };
    });
  }

  lsSave();showToast('紀錄已更新！','ok');el.classList.add('hidden');renderHistory();
}

function deleteLog(id){
  if(!confirm('確定要刪除這筆課程紀錄嗎？\n此操作無法復原。'))return;
  ST.logs=ST.logs.filter(function(l){return l.id!=id;});
  lsSave();showToast('課程紀錄已刪除','ok');renderHistory();
}

// ── Toast ─────────────────────────────────────────────────
function showToast(msg,type){
  var el=document.getElementById('toast');
  el.textContent=msg;el.className='toast '+(type||'');el.classList.add('show');
  clearTimeout(el._t);el._t=setTimeout(function(){el.classList.remove('show');},2500);
}

renderStudents();
</script>
