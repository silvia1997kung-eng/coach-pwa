<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Coach Studio">
<meta name="theme-color" content="#6F8D6B">
<title>Coach Studio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --g1:#6F8D6B;--g2:#A8C6A1;--g3:#E8F2E7;--g4:#4A6347;
  --b1:#A4BCC2;--b2:#E4EEF0;
  --cream:#F5EAC2;--bg:#FAF8F2;--surface:#fff;--surface2:#F0EDE3;
  --text:#2C3A2A;--text2:#5A6B57;--text3:#8FA68C;
  --border:#D8E4D6;--border2:#C5D8C2;
  --red:#8B3A2A;--red-l:#F5E8E5;
  --r:12px;--r2:8px;--r3:6px;
  --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)
}
@keyframes spin{to{transform:rotate(360deg)}}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;font-size:15px;color:var(--text)}
#app{display:flex;flex-direction:column;height:100%;padding-top:var(--st)}
.hdr{background:var(--g1);color:#fff;padding:14px 16px 12px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.hdr-title{font-size:17px;font-weight:600}
.hdr-sub{font-size:12px;opacity:.75;margin-top:1px}
.hdr-btns{display:flex;gap:8px}
.hdr-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.2);border:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px;position:relative;font-family:inherit}
.hdr-btn.hidden{display:none}
.upd-dot{width:8px;height:8px;background:var(--cream);border-radius:50%;position:absolute;top:4px;right:4px;display:none;border:1.5px solid var(--g4)}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg);padding:14px 14px calc(80px + var(--sb))}
.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--border);display:flex;padding-bottom:var(--sb);z-index:100}
.ntab{flex:1;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--text3);border:none;background:none;font-family:inherit;font-size:10px;font-weight:500}
.ntab.active{color:var(--g4)}
.ntab svg{width:22px;height:22px}
.card{background:var(--surface);border-radius:var(--r);padding:14px;margin-bottom:10px;border:1px solid var(--border)}
.card-title{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;margin-bottom:14px}
.slbl{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 8px;display:flex;align-items:center;gap:8px}
.slbl::after{content:'';flex:1;height:1px;background:var(--g2)}
.btn{padding:9px 16px;border-radius:var(--r2);border:1px solid var(--border2);background:var(--surface);cursor:pointer;font-size:13px;color:var(--text);display:inline-flex;align-items:center;gap:6px;font-family:inherit;font-weight:500;-webkit-appearance:none}
.btn:active{opacity:.7}
.btn-p{background:var(--g1);color:#fff;border-color:var(--g1)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-t{background:var(--b2);color:#2C5A62;border-color:var(--b2)}
.btn-d{background:var(--red-l);color:var(--red);border-color:var(--red-l)}
.btn-blk{width:100%;justify-content:center}
.btn-gh{border-color:transparent;background:transparent;padding-left:4px;padding-right:4px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:12px;font-weight:600;color:var(--text2)}
.field input,.field select,.field textarea{border:1px solid var(--border2);border-radius:var(--r2);padding:10px 12px;font-size:15px;background:var(--surface);color:var(--text);width:100%;font-family:inherit;-webkit-appearance:none;appearance:none}
.field textarea{resize:vertical;min-height:80px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--g1);box-shadow:0 0 0 3px var(--g3)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bdg{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.bdg-g{background:var(--g3);color:var(--g4)}
.bdg-b{background:var(--b2);color:#2C5A62}
.bdg-gr{background:var(--surface2);color:var(--text2)}
.stu-item{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--surface);border-radius:var(--r);margin-bottom:8px;border:1px solid var(--border);cursor:pointer}
.stu-av{width:42px;height:42px;border-radius:50%;background:var(--g2);color:var(--g4);font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.irow{display:flex;justify-content:space-between;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border)}
.irow:last-child{border-bottom:none}
.ilbl{font-size:12px;color:var(--text2);font-weight:500;min-width:90px}
.ival{font-size:13px;color:var(--text);font-weight:500;text-align:right;flex:1}
.ex-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.ex-hd{background:var(--cream);padding:11px 13px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.ex-hd-title{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
.ex-body{padding:13px}
.stbl{width:100%;border-collapse:collapse;font-size:13px}
.stbl th{padding:7px 6px;background:var(--cream);color:var(--text2);font-weight:600;font-size:11px;text-align:left;border-bottom:1px solid var(--border)}
.stbl th:first-child{width:30px;text-align:center}
.stbl td{padding:5px 4px;border-bottom:1px solid var(--border);vertical-align:middle}
.stbl td:first-child{text-align:center;font-size:11px;color:var(--text3);font-weight:600}
.stbl tr:last-child td{border-bottom:none}
.si{border:1px solid var(--border2);border-radius:var(--r3);padding:6px 7px;font-size:13px;background:var(--surface);color:var(--text);width:100%;font-family:inherit;-webkit-appearance:none}
.si:focus{outline:none;border-color:var(--g1);box-shadow:0 0 0 2px var(--g3)}
.add-r-btn{border:1px dashed var(--border2);border-radius:var(--r2);padding:8px;font-size:12px;color:var(--text3);background:transparent;width:100%;display:flex;align-items:center;justify-content:center;gap:5px;margin-top:8px;cursor:pointer;font-family:inherit}
.add-r-btn:active{background:var(--g3);color:var(--g1)}
.add-ex-btn{border:2px dashed var(--border2);border-radius:var(--r);padding:16px;font-size:14px;color:var(--text3);background:transparent;width:100%;display:flex;align-items:center;justify-content:center;gap:7px;margin-top:6px;cursor:pointer;font-family:inherit}
.add-ex-btn:active{background:var(--g3);color:var(--g1)}
.seg{display:flex;background:var(--g3);border-radius:var(--r2);padding:3px;gap:2px;margin-bottom:14px}
.seg-btn{flex:1;padding:8px 4px;border-radius:var(--r3);border:none;background:transparent;font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;font-family:inherit;text-align:center}
.seg-btn.active{background:var(--cream);color:var(--g4);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.spr-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.sdot{width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid transparent;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff}
.sdot.sel{border-color:var(--text)}
.spr-qty-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.spr-chip{display:flex;align-items:center;gap:6px;font-size:12px;background:var(--surface2);padding:5px 10px;border-radius:20px;border:1px solid var(--border)}
.photo-zone{border:2px dashed var(--border2);border-radius:var(--r);padding:28px 16px;text-align:center;cursor:pointer;color:var(--text3);margin-bottom:12px}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.photo-thumb{position:relative;border-radius:var(--r2);overflow:hidden;aspect-ratio:1;border:1px solid var(--border)}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.photo-del{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.55);border:none;color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.photo-cap{width:100%;margin-top:4px;border:1px solid var(--border2);border-radius:var(--r3);padding:5px 8px;font-size:12px;background:var(--surface);color:var(--text);font-family:inherit}
.log-card{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);margin-bottom:10px;overflow:hidden}
.log-hd{background:var(--cream);padding:11px 13px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px}
.log-body{padding:12px 13px}
.toast{position:fixed;top:calc(var(--st) + 60px);left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 18px;border-radius:30px;font-size:13px;font-weight:500;z-index:9999;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.toast.ok{background:var(--g4)}
.toast.err{background:var(--red)}
.page{display:none}.page.active{display:block}.hidden{display:none!important}
.back-hd{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.back-hd h2{font-size:17px;font-weight:600;flex:1}
.db-blbl{font-size:11px;font-weight:700;color:var(--g1);text-transform:uppercase;letter-spacing:.06em;padding:8px 0 4px;border-top:1px solid var(--border);margin-top:8px}
.db-blbl:first-child{border-top:none;margin-top:0}
.db-row{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);gap:10px}
.db-row:last-child{border-bottom:none}
.upd-banner{position:fixed;top:0;left:0;right:0;z-index:9998;background:var(--g4);color:#fff;padding:12px 16px;padding-top:calc(12px + var(--st));display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;box-shadow:0 2px 12px rgba(0,0,0,.3)}
.upd-banner-btn{background:var(--cream);color:var(--text);border:none;border-radius:var(--r2);padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
</style>
</head>
<body>
<div id="app">
  <div class="hdr">
    <div>
      <div class="hdr-title" id="hdr-title">Coach Studio</div>
      <div class="hdr-sub" id="hdr-sub">教練管理系統</div>
    </div>
    <div class="hdr-btns">
      <button class="hdr-btn hidden" id="hdr-add" onclick="hdrAdd()">＋</button>
      <button class="hdr-btn" id="hdr-upd" onclick="manualUpdate()" title="檢查更新">
        <span id="upd-dot" class="upd-dot"></span>
        <svg id="upd-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="20" height="20"><path d="M20 11A8.1 8.1 0 0 0 4.5 9M4 5v4h4"/><path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4"/></svg>
      </button>
    </div>
  </div>

  <div class="content" id="main-content">
    <div id="page-students" class="page active">
      <div id="vlist"><div id="slist"></div></div>
      <div id="vdetail" class="hidden"></div>
      <div id="vform" class="hidden"></div>
    </div>
    <div id="page-log" class="page">
      <div class="card">
        <div class="card-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18" style="color:var(--g1)"><rect x="4" y="5" width="16" height="16" rx="2"/><line x1="16" y1="3" x2="16" y2="7"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="4" y1="11" x2="20" y2="11"/><rect x="8" y="15" width="2" height="2"/></svg> 課程基本資訊</div>
        <div class="f2">
          <div class="field"><label>學員</label><select id="log-stu"></select></div>
          <div class="field"><label>日期</label><input id="log-date" type="date"></div>
        </div>
        <div class="f2">
          <div class="field"><label>時間</label><input id="log-time" type="time" value="09:00"></div>
          <div class="field"><label>地點</label><input id="log-loc" placeholder="健身房"></div>
        </div>
      </div>
      <div class="seg">
        <button class="seg-btn active" onclick="switchSeg('w')" id="sb-w">重訓</button>
        <button class="seg-btn" onclick="switchSeg('p')" id="sb-p">皮拉提斯</button>
        <button class="seg-btn" onclick="switchSeg('ph')" id="sb-ph">照片</button>
        <button class="seg-btn" onclick="switchSeg('n')" id="sb-n">備註</button>
      </div>
      <div id="sc-w"><div id="wexs"></div><button class="add-ex-btn" onclick="addWEx()">＋ 新增重訓動作</button></div>
      <div id="sc-p" class="hidden"><div id="pexs"></div><button class="add-ex-btn" onclick="addPEx()">＋ 新增皮拉提斯動作</button></div>
      <div id="sc-ph" class="hidden">
        <div id="ph-grid" class="photo-grid"></div>
        <div class="photo-zone" onclick="document.getElementById('ph-input').click()">
          <div style="font-size:32px;margin-bottom:8px">📷</div>
          <p style="font-size:14px;margin-bottom:4px">點擊上傳照片</p>
          <small style="font-size:12px">可一次選多張</small>
        </div>
        <input type="file" id="ph-input" accept="image/*" multiple style="display:none" onchange="handlePhoto(event)">
      </div>
      <div id="sc-n" class="hidden">
        <div class="field"><label>今日備註</label><textarea id="log-note" placeholder="今日學員狀態、追蹤事項…"></textarea></div>
      </div>
      <div style="display:flex;gap:8px;margin-top:14px">
        <button class="btn btn-p btn-blk" onclick="saveLog()">💾 儲存本次課程</button>
        <button class="btn" onclick="clearLog()">↺</button>
      </div>
    </div>
    <div id="page-db" class="page">
      <div class="seg">
        <button class="seg-btn active" onclick="switchDbSeg('w')" id="dbs-w">重訓動作庫</button>
        <button class="seg-btn" onclick="switchDbSeg('p')" id="dbs-p">皮拉提斯動作庫</button>
      </div>
      <div id="dbc-w">
        <div id="dbwl"></div>
        <div class="card" style="border-style:dashed">
          <div class="card-title">＋ 新增重訓動作</div>
          <div class="f2">
            <div class="field"><label>動作名稱</label><input id="dbwn" placeholder="槓鈴深蹲"></div>
            <div class="field"><label>目標肌群</label><input id="dbwm" placeholder="股四頭肌"></div>
          </div>
          <div class="field"><label>備注</label><input id="dbwnote" placeholder="注意事項"></div>
          <button class="btn btn-p btn-blk" onclick="addDbEx('w')">＋ 新增</button>
        </div>
      </div>
      <div id="dbc-p" class="hidden">
        <div id="dbpl"></div>
        <div class="card" style="border-style:dashed">
          <div class="card-title">＋ 新增皮拉提斯動作</div>
          <div class="field"><label>BASI 板塊</label><select id="dbpb" onchange="onDbBlockChange()">
              <option>Warm Up</option><option>Footwork</option><option>Abdominal</option><option>Hip Work</option>
              <option>Spinal Articulation</option><option>Stretches</option>
              <option>Full Body Integration 1</option><option>Full Body Integration 2</option>
              <option>Arm Work</option><option>Leg Work</option>
              <option>Lateral Flexion &amp; Rotation</option><option>Back Extension</option>
            </select></div>
          <div id="db-block-existing" style="margin-bottom:10px;padding:10px;background:var(--g3);border-radius:var(--r2);font-size:12px;display:none">
            <div style="font-weight:600;color:var(--g4);margin-bottom:6px">此板塊現有動作：</div>
            <div id="db-block-existing-list" style="color:var(--text2);line-height:1.8"></div>
          </div>
          <div class="field"><label>動作名稱（輸入新動作）</label><input id="dbpn" placeholder="輸入新動作名稱"></div>
          <div class="f2">
            <div class="field"><label>難易程度</label><select id="dbpl2"><option>基礎</option><option>中級</option><option>進階</option></select></div>
            <div class="field"><label>目標肌群</label><input id="dbpm" placeholder="腹部核心"></div>
          </div>
          <div class="field"><label>備注</label><input id="dbpnote" placeholder="注意事項"></div>
          <button class="btn btn-t btn-blk" onclick="addDbEx('p')">＋ 新增</button>
        </div>
      </div>
    </div>
    <div id="page-history" class="page">
      <div class="field" style="margin-bottom:12px">
        <select id="hf" onchange="renderHistory()"><option value="">全部學員</option></select>
      </div>
      <div id="hlist"></div>
    </div>
  </div>

  <div class="bnav">
    <button class="ntab active" onclick="showPage('students')" id="nav-students">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7m-4 0a4 4 0 1 0 8 0 4 4 0 1 0-8 0"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><path d="M21 21v-2a4 4 0 0 0-3-3.85"/></svg>
      學員
    </button>
    <button class="ntab" onclick="showPage('log')" id="nav-log">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v6"/><line x1="16" y1="3" x2="16" y2="7"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="4" y1="11" x2="20" y2="11"/><line x1="16" y1="19" x2="22" y2="19"/><line x1="19" y1="16" x2="19" y2="22"/></svg>
      上課
    </button>
    <button class="ntab" onclick="showPage('db')" id="nav-db">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6a8 3 0 0 0 16 0V6"/><path d="M4 12v6a8 3 0 0 0 16 0v-6"/></svg>
      動作庫
    </button>
    <button class="ntab" onclick="showPage('history')" id="nav-history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="12 8 12 12 14 14"/><path d="M3.05 11a9 9 0 1 1 .5 4m-.5 5v-5h5"/></svg>
      紀錄
    </button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ── 版本 & 更新 ──────────────────────────────────────────
const APP_VERSION = '1.0.0';
function manualUpdate(){
  showToast('正在檢查更新…');
  var icon = document.getElementById('upd-icon');
  if(icon) icon.style.animation = 'spin 1s linear infinite';
  fetch(location.href + '?nc=' + Date.now(), {cache:'no-store'})
    .then(function(r){ return r.text(); })
    .then(function(html){
      if(icon) icon.style.animation = '';
      var m = html.match(/APP_VERSION = '([^']+)'/);
      if(m && m[1] && m[1] !== APP_VERSION){
        showUpdBanner(m[1]);
      } else {
        showToast('已是最新版本 v' + APP_VERSION + ' ✓', 'ok');
      }
    })
    .catch(function(){
      if(icon) icon.style.animation = '';
      showToast('無法連線，請確認網路', 'err');
    });
}
function showUpdBanner(v){
  if(document.getElementById('upd-banner')) return;
  var el = document.createElement('div');
  el.id = 'upd-banner';
  el.className = 'upd-banner';
  el.innerHTML = '<div style="display:flex;align-items:center;gap:9px"><span style="font-size:20px">🔄</span><div><div style="font-weight:600">新版本 v'+v+' 可用</div><div style="opacity:.75;font-size:11px;margin-top:2px">點更新以使用最新功能</div></div></div>'
    + '<button class="upd-banner-btn" onclick="doUpdate()">立即更新</button>';
  document.body.insertBefore(el, document.body.firstChild);
  var dot = document.getElementById('upd-dot');
  if(dot) dot.style.display = 'block';
}
function doUpdate(){
  if('caches' in window){
    caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k); })); })
      .then(function(){ location.reload(true); });
  } else { location.reload(true); }
}
window.addEventListener('load', function(){
  setTimeout(function(){
    fetch(location.href + '?nc=' + Date.now(), {cache:'no-store'})
      .then(function(r){ return r.text(); })
      .then(function(html){
        var m = html.match(/APP_VERSION = '([^']+)'/);
        if(m && m[1] && m[1] !== APP_VERSION) showUpdBanner(m[1]);

function deleteStu(id){
  var s = ST.students.find(function(x){ return x.id === id; });
  if(!s) return;
  var logs = ST.logs.filter(function(l){ return l.sid === id; }).length;
  var msg = '確定要刪除學員「'+s.name+'」嗎？';
  if(logs > 0) msg += '\n（同時刪除 '+logs+' 筆課程紀錄）';
  msg += '\n此操作無法復原。';
  if(!confirm(msg)) return;
  ST.students = ST.students.filter(function(x){ return x.id !== id; });
  ST.logs = ST.logs.filter(function(l){ return l.sid !== id; });
  lsSave();
  showToast('學員已刪除','ok');
  showStuList();
}

function toggleSpr(id, el, color){

function renderSprQty(id, color, add, def){
  var row = document.getElementById(id+'-sqty');
  if(!row) return;
  var ex = row.querySelector('[data-color="'+color+'"]');
  var ci = SPRINGSDEF.find(function(c){ return c.key===color; });
  if(add && !ex){
    var w = document.createElement('div');
    w.className = 'spr-chip'; w.dataset.color = color;
    w.innerHTML = '<span style="width:12px;height:12px;border-radius:50%;background:'+ci.hex+';display:inline-block"></span>'
      +'<span style="color:var(--text2)">'+color+' ('+ci.val+')</span>'
      +'<input type="number" min="1" max="10" value="'+(def||1)+'" data-qty '
      +'style="width:44px;border:1px solid var(--border2);border-radius:var(--r3);padding:3px 6px;font-size:12px;background:var(--surface);color:var(--text);font-family:inherit"> 條';
    row.appendChild(w);

function collectSpr(id){
  var row = document.getElementById(id+'-sqty');
  if(!row) return [];
  return Array.from(row.querySelectorAll('[data-color]')).map(function(w){
    return {color: w.dataset.color, qty: (w.querySelector('[data-qty]')||{}).value||'1'};
  });
}

// 儲存課程
function saveLog(){
  var date = document.getElementById('log-date').value;
  var sid = parseInt(document.getElementById('log-stu').value);
  if(!date||!sid){ showToast('請填寫日期和學員','err'); return; }
  var wBlocks = document.querySelectorAll('[id^="wex-"]');
  var pBlocks = document.querySelectorAll('[id^="pex-"]');
  var wex = Array.from(wBlocks).map(function(b){
    var rows = b.querySelectorAll('tbody tr');
    return {
      name: (document.getElementById(b.id+'-name')||{}).value||'',
      sets: Array.from(rows).map(function(r){
        var ins = r.querySelectorAll('input');
        return {w:ins[0]&&ins[0].value||'', r:ins[1]&&ins[1].value||'', rest:ins[2]&&ins[2].value||'', note:ins[3]&&ins[3].value||''};
      })
    };
  });
  var pex = Array.from(pBlocks).map(function(b){
    return {
      name:(document.getElementById(b.id+'-name')||{}).value||'',
      block:(document.getElementById(b.id+'-blk')||{}).value||'',
      level:(document.getElementById(b.id+'-lv')||{}).value||'',
      muscle:(document.getElementById(b.id+'-mu')||{}).value||'',
      springs:collectSpr(b.id),
      cspring:(document.getElementById(b.id+'-csp')||{}).value||'',
      times:(document.getElementById(b.id+'-ti')||{}).value||'',
      note:(document.getElementById(b.id+'-no')||{}).value||''
    };
  });
  ST.logs.unshift({
    id:ST.nextId++, sid:sid,
    date:date.replace(/-/g,'/'),
    time:document.getElementById('log-time').value,
    loc:document.getElementById('log-loc').value,
    wex:wex, pex:pex,
    photos:logPhotos.map(function(p){ return {url:p.url,cap:p.cap}; }),
    note:document.getElementById('log-note').value
  });
  lsSave();
  showToast('課程紀錄已儲存！','ok');
  clearLog();
}

function clearLog(){
  document.getElementById('wexs').innerHTML = '';
  document.getElementById('pexs').innerHTML = '';
  document.getElementById('log-note').value = '';
  document.getElementById('log-loc').value = '';
  document.getElementById('ph-grid').innerHTML = '';
  logPhotos = []; wCnt = 0; pCnt = 0;
  switchSeg('w');
}

function onDbBlockChange(){
  var block = document.getElementById('dbpb').value;
  // Show existing exercises in this block
  var names = getPNames(block);
  var box = document.getElementById('db-block-existing');
  var list = document.getElementById('db-block-existing-list');
  if(names.length && box && list){
    list.innerHTML = names.map(function(n){ return '• '+n; }).join('<br>');
    box.style.display = 'block';
  } else if(box){
    box.style.display = 'none';
  }
  // Also filter the list above
  filterDbPList();
}

function filterDbPList(){
  var block = document.getElementById('dbpb').value;
  var rows = document.querySelectorAll('#dbpl .db-blbl, #dbpl .db-row');
  var curBlock = '';
  rows.forEach(function(el){
    if(el.classList.contains('db-blbl')){
      curBlock = el.textContent.trim();
      el.style.display = (curBlock === block) ? '' : 'none';
    } else {
      el.style.display = (curBlock === block) ? '' : 'none';
    }
  });
}

function renderDb(){
  renderDbW();
  renderDbP();
  // Reset block filter display
  var box = document.getElementById('db-block-existing');
  if(box) box.style.display = 'none';
}

function renderDbW(){
  document.getElementById('dbwl').innerHTML = ST.exercises.w.map(function(e,i){
    return '<div class="db-row">'
      +'<div style="flex:1;min-width:0"><div style="font-weight:600;font-size:14px">'+e.name+'</div>'
      +'<div style="font-size:12px;color:var(--text2)">'+e.muscle+(e.note?' · '+e.note:'')+'</div></div>'
      +'<button class="btn btn-d btn-sm" onclick="rmDb(\'w\','+i+')">✕</button>'
      +'</div>';
  }).join('');
}

function renderDbP(){
  // Reset filter when re-rendering
  var byBlock = {};
  BASI.forEach(function(b){ byBlock[b] = []; });
  ST.exercises.p.forEach(function(e){ if(byBlock[e.block]) byBlock[e.block].push(e); });
  document.getElementById('dbpl').innerHTML = BASI.map(function(b){
    var exs = byBlock[b]; if(!exs.length) return '';
    return '<div class="db-blbl">'+b+'</div>'
      +exs.map(function(e){
        var i = ST.exercises.p.indexOf(e);
        return '<div class="db-row">'
          +'<div style="flex:1;min-width:0"><div style="font-weight:600;font-size:14px">'+e.name
          +' <span class="bdg bdg-b" style="font-size:10px">'+e.level+'</span></div>'
          +'<div style="font-size:12px;color:var(--text2)">'+e.muscle+(e.note?' · '+e.note:'')+'</div></div>'
          +'<button class="btn btn-d btn-sm" onclick="rmDb(\'p\','+i+')">✕</button>'
          +'</div>';
      }).join('');
  }).join('');
}

function addDbEx(type){
  if(type==='w'){
    var name = document.getElementById('dbwn').value;
    if(!name){ showToast('請輸入動作名稱','err'); return; }
    ST.exercises.w.push({name:name, muscle:document.getElementById('dbwm').value, note:document.getElementById('dbwnote').value});
    document.getElementById('dbwn').value=''; document.getElementById('dbwm').value=''; document.getElementById('dbwnote').value='';
    renderDbW();
  } else {
    var pname = document.getElementById('dbpn').value;
    if(!pname){ showToast('請輸入動作名稱','err'); return; }
    ST.exercises.p.push({name:pname, block:document.getElementById('dbpb').value,
      level:document.getElementById('dbpl2').value, muscle:document.getElementById('dbpm').value,
      note:document.getElementById('dbpnote').value});
    document.getElementById('dbpn').value=''; document.getElementById('dbpm').value=''; document.getElementById('dbpnote').value='';
    renderDbP();
  }
  lsSave();
  showToast('動作已加入資料庫！','ok');
}

function rmDb(type, idx){
  ST.exercises[type].splice(idx,1);
  lsSave();
  type==='w' ? renderDbW() : renderDbP();
}

    });
    exDiv.appendChild(addSetBtn2);

    // Insert before this button
    el.insertBefore(exDiv, addWBtn);
    // Update l.wex array to include new slot
    if(!l.wex) l.wex = [];
    l.wex.push({name:'', sets:[]});
  });
  el.appendChild(addWBtn);

  // ── 皮拉提斯區塊
  if(l.pex && l.pex.length){
    var pLabel = document.createElement('div');
    pLabel.className = 'slbl';
    pLabel.textContent = '皮拉提斯';
    el.appendChild(pLabel);

    l.pex.forEach(function(ex, pi){
      var pDiv = document.createElement('div');
      pDiv.style.cssText = 'margin-bottom:12px;background:var(--surface2);border-radius:var(--r2);padding:10px';

      // Block + Name
      var blockOpts = ['Warm Up','Footwork','Abdominal','Hip Work','Spinal Articulation','Stretches',
        'Full Body Integration 1','Full Body Integration 2','Arm Work','Leg Work',
        'Lateral Flexion & Rotation','Back Extension']
        .map(function(b){ return '<option'+(ex.block===b?' selected':'')+'>'+b+'</option>'; }).join('');

      var row1 = document.createElement('div');
      row1.className = 'f2';
      row1.innerHTML = '<div class="field"><label>BASI 板塊</label><select id="ed-pblk-'+id+'-'+pi+'">'+blockOpts+'</select></div>'
        +'<div class="field"><label>動作名稱</label><input id="ed-pname-'+id+'-'+pi+'" value="'+(ex.name||'')+'" placeholder="動作名稱"></div>';
      pDiv.appendChild(row1);

      var row2 = document.createElement('div');
      row2.className = 'f2';
      var lvOpts = ['基礎','中級','進階'].map(function(l){ return '<option'+(ex.level===l?' selected':'')+'>'+l+'</option>'; }).join('');
      row2.innerHTML = '<div class="field"><label>難易程度</label><select id="ed-plv-'+id+'-'+pi+'">'+lvOpts+'</select></div>'
        +'<div class="field"><label>目標肌群</label><input id="ed-pmu-'+id+'-'+pi+'" value="'+(ex.muscle||'')+'" placeholder="腹部核心"></div>';
      pDiv.appendChild(row2);

      // Springs display
      var sprField = document.createElement('div');
      sprField.className = 'field';
      var sprVal = (ex.springs||[]).map(function(s){ return s.color+'×'+s.qty; }).join(' + ');
      if(ex.cspring) sprVal += (sprVal?' + ':'')+ex.cspring;
      sprField.innerHTML = '<label>彈簧重</label><input id="ed-pspr-'+id+'-'+pi+'" value="'+sprVal+'" placeholder="例：紅×2 + 藍×1">';
      pDiv.appendChild(sprField);

      var row3 = document.createElement('div');
      row3.className = 'f2';
      row3.innerHTML = '<div class="field"><label>已學習次數</label><input type="number" id="ed-pti-'+id+'-'+pi+'" value="'+(ex.times||0)+'" min="0"></div>'
        +'<div class="field"><label>注意情況</label><input id="ed-pno-'+id+'-'+pi+'" value="'+(ex.note||'')+'"></div>';
      pDiv.appendChild(row3);

      el.appendChild(pDiv);
    });
  }

  // ── 新增皮拉提斯動作按鈕
  var addPBtn = document.createElement('button');
  addPBtn.className = 'add-ex-btn';
  addPBtn.textContent = '＋ 新增皮拉提斯動作';
  addPBtn.style.marginBottom = '10px';
  addPBtn.addEventListener('click', function(){
    var pi = el.querySelectorAll('[id^="ed-pblk-'+id+'"]').length;
    if(!l.pex) l.pex = [];
    l.pex.push({name:'',block:'Footwork',level:'基礎',muscle:'',springs:[],cspring:'',times:'1',note:''});
    var ex = l.pex[l.pex.length-1];

    var pDiv = document.createElement('div');
    pDiv.style.cssText = 'margin-bottom:12px;background:var(--surface2);border-radius:var(--r2);padding:10px';

    var blockOpts = ['Warm Up','Footwork','Abdominal','Hip Work','Spinal Articulation','Stretches',
      'Full Body Integration 1','Full Body Integration 2','Arm Work','Leg Work',
      'Lateral Flexion & Rotation','Back Extension']
      .map(function(b){ return '<option>'+b+'</option>'; }).join('');

    var row1 = document.createElement('div');
    row1.className = 'f2';
    row1.innerHTML = '<div class="field"><label>BASI 板塊</label><select id="ed-pblk-'+id+'-'+pi+'">'+blockOpts+'</select></div>'
      +'<div class="field"><label>動作名稱</label><input id="ed-pname-'+id+'-'+pi+'" placeholder="動作名稱"></div>';
    pDiv.appendChild(row1);

    var lvOpts = ['基礎','中級','進階'].map(function(lv){ return '<option>'+lv+'</option>'; }).join('');
    var row2 = document.createElement('div');
    row2.className = 'f2';
    row2.innerHTML = '<div class="field"><label>難易程度</label><select id="ed-plv-'+id+'-'+pi+'">'+lvOpts+'</select></div>'
      +'<div class="field"><label>目標肌群</label><input id="ed-pmu-'+id+'-'+pi+'" placeholder="腹部核心"></div>';
    pDiv.appendChild(row2);

    var sprField = document.createElement('div');
    sprField.className = 'field';
    sprField.innerHTML = '<label>彈簧重</label><input id="ed-pspr-'+id+'-'+pi+'" placeholder="例：紅×2 + 藍×1">';
    pDiv.appendChild(sprField);

    var row3 = document.createElement('div');
    row3.className = 'f2';
    row3.innerHTML = '<div class="field"><label>已學習次數</label><input type="number" id="ed-pti-'+id+'-'+pi+'" value="1" min="0"></div>'
      +'<div class="field"><label>注意情況</label><input id="ed-pno-'+id+'-'+pi+'" placeholder="今日觀察…"></div>';
    pDiv.appendChild(row3);

    el.insertBefore(pDiv, addPBtn);
  });
  el.appendChild(addPBtn);

  // ── 備註
  var noteField = document.createElement('div');
  noteField.className = 'field';
  noteField.innerHTML = '<label>今日備註</label>';
  var noteTA = document.createElement('textarea');
  noteTA.id = 'ed-note-'+id;
  noteTA.textContent = l.note || '';
  noteField.appendChild(noteTA);
  el.appendChild(noteField);

  // ── 按鈕
  var btnRow = document.createElement('div');
  btnRow.style.cssText = 'display:flex;gap:8px;margin-top:12px';
  var saveBtn = document.createElement('button');
  saveBtn.className = 'btn btn-p btn-blk';
  saveBtn.textContent = '✓ 儲存所有修改';
  saveBtn.addEventListener('click', function(){ saveHistEdit(id); });
  var cancelBtn = document.createElement('button');
  cancelBtn.className = 'btn';
  cancelBtn.textContent = '取消';
  cancelBtn.addEventListener('click', function(){ el.classList.add('hidden'); });
  btnRow.appendChild(saveBtn);
  btnRow.appendChild(cancelBtn);
  el.appendChild(btnRow);
}

function saveHistEdit(id){
  var l = ST.logs.find(function(x){ return x.id==id; });
  if(!l){ showToast('找不到紀錄','err'); return; }
  var el = document.getElementById('he-'+id);
  if(!el){ return; }

  // Basic info
  var dateEl = el.querySelector('#ed-date-'+id);
  var timeEl = el.querySelector('#ed-time-'+id);
  var locEl  = el.querySelector('#ed-loc-'+id);
  var noteEl = el.querySelector('#ed-note-'+id);
  if(dateEl) l.date = dateEl.value;
  if(timeEl) l.time = timeEl.value;
  if(locEl)  l.loc  = locEl.value;
  if(noteEl) l.note = noteEl.value;

  // Weight exercises - collect ALL ed-wname elements (including newly added)
  var allWNames = el.querySelectorAll('[id^="ed-wname-'+id+'-"]');
  l.wex = Array.from(allWNames).map(function(nameEl, ei){
    var tbody = el.querySelector('#ed-wtb-'+id+'-'+ei);
    var sets = [];
    if(tbody){
      sets = Array.from(tbody.querySelectorAll('tr')).map(function(tr){
        var ins = tr.querySelectorAll('input');
        return {
          w:    ins[0] ? ins[0].value : '',
          r:    ins[1] ? ins[1].value : '',
          rest: ins[2] ? ins[2].value : '',
          note: ins[3] ? ins[3].value : ''
        };
      });
    }
    return { name: nameEl.value, sets: sets };
  });

  // Pilates exercises - collect ALL ed-pblk elements (including newly added)
  var allPBlks = el.querySelectorAll('[id^="ed-pblk-'+id+'-"]');
  l.pex = Array.from(allPBlks).map(function(blkEl, pi){
    var nmEl  = el.querySelector('#ed-pname-'+id+'-'+pi);
    var lvEl  = el.querySelector('#ed-plv-'+id+'-'+pi);
    var muEl  = el.querySelector('#ed-pmu-'+id+'-'+pi);
    var sprEl = el.querySelector('#ed-pspr-'+id+'-'+pi);
    var tiEl  = el.querySelector('#ed-pti-'+id+'-'+pi);
    var noEl  = el.querySelector('#ed-pno-'+id+'-'+pi);
    return {
      block:   blkEl.value,
      name:    nmEl  ? nmEl.value  : '',
      level:   lvEl  ? lvEl.value  : '基礎',
      muscle:  muEl  ? muEl.value  : '',
      cspring: sprEl ? sprEl.value : '',
      times:   tiEl  ? tiEl.value  : '1',
      note:    noEl  ? noEl.value  : '',
      springs: []
    };
  });

  lsSave();
  showToast('紀錄已更新！','ok');
  el.classList.add('hidden');
  renderHistory();
}

function deleteLog(id){
  if(!confirm('確定要刪除這筆課程紀錄嗎？\n此操作無法復原。')) return;
  ST.logs = ST.logs.filter(function(l){ return l.id !== id; });
  lsSave();
  showToast('課程紀錄已刪除','ok');
  renderHistory();
}

// ── Toast ─────────────────────────────────────────────────
function showToast(msg, type){
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast '+(type||'');
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(function(){ el.classList.remove('show'); }, 2500);
}

// ── 啟動 ──────────────────────────────────────────────────
renderStudents();
</script>
</body>
